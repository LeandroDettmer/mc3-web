# mc3-web's server (README.md): the start page, the browser build, the disc
# folders, and the virtual LAN switch at /lan for System Link.  Modelled on
# nfsu2-web's web/server-rs (MIT, th0mk): its ws crate as is, its lan switch's
# protocol (crates/lan), its free-roam hub (crates/roam, game-agnostic), without NFSU2's Online, names and bans.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mc3-ws = { path = "crates/ws" }
mc3-lan = { path = "crates/lan" }
mc3-roam = { path = "crates/roam" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
sha1 = "0.10"
base64 = "0.22"
serde_json = "1"

[package]
name = "mc3-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mc3-ws.workspace = true
mc3-lan.workspace = true
mc3-roam.workspace = true
tokio.workspace = true
bytes.workspace = true
serde_json.workspace = true

[profile.release]
opt-level = 3
