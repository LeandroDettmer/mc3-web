# The races Worker (src/index.js). Copy to a private folder as wrangler.toml, fill in your own values, then
# `npx wrangler deploy` there with `main` pointing back at this folder's src/index.js.
name = "mc3-races"
main = "src/index.js"
compatibility_date = "2025-09-01"
# account_id = "<your Cloudflare account id>"

# The page connects to wss://<host>/races. A custom domain on a zone of your account:
workers_dev = false
preview_urls = false
routes = [{ pattern = "races.example.com", custom_domain = true }]

[durable_objects]
bindings = [{ name = "LOBBY", class_name = "Lobby" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]   # SQLite-backed DO: available on the free plan; Lobby keeps no storage beyond its alarm

[vars]
# the page's origins, exact scheme://host, comma-separated; anything else gets 403
ALLOW_ORIGINS = "https://play.example.com"
